<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pritesh Sir's Maths App!</title>
    <meta name="description" content="Windows 11 Fluent UI digital mathematics tutor and adaptive learning studio for Standards 8 to 12 (ICSE Selina Concise Mathematics &amp; CBSE), featuring voice tutoring, adaptive sums, interactive visualizers, and cloud-synced parent &amp; teacher dashboards." />
    <meta property="og:title" content="Pritesh Sir's Maths App!" />
    <meta property="og:description" content="Windows 11 Fluent UI digital mathematics tutor and adaptive learning studio for Standards 8 to 12 (ICSE Selina Concise Mathematics &amp; CBSE), featuring voice tutoring, adaptive sums, interactive visualizers, and cloud-synced parent &amp; teacher dashboards." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SelinaMath" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,600;1,400&family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <style>
      #boot-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }
      @media (prefers-color-scheme: dark) {
        #boot-shell {
          background: #020617;
          color: #f1f5f9;
        }
      }
      #boot-spinner {
        width: 28px;
        height: 28px;
        border-radius: 9999px;
        border: 3px solid rgba(14, 165, 233, 0.25);
        border-top-color: #0ea5e9;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      #boot-recovery {
        display: none;
        margin-top: 8px;
        text-align: center;
        max-width: 320px;
      }
      #boot-reload-btn {
        margin-top: 10px;
        padding: 8px 16px;
        border-radius: 8px;
        border: none;
        background: #0284c7;
        color: #ffffff;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased selection:bg-sky-500/20 selection:text-sky-600 dark:selection:text-sky-300">
    <div id="root">
      <div id="boot-shell" role="status" aria-live="polite">
        <div id="boot-spinner" aria-hidden="true"></div>
        <div style="font-size: 15px; font-weight: 600;">Pritesh Sir's Maths App!</div>
        <div id="boot-status" style="font-size: 12px; opacity: 0.72;">Starting workspace…</div>
        <div id="boot-recovery">
          <div style="font-size: 12px; opacity: 0.8; line-height: 1.45;">
            Taking longer than expected on this connection. Clear cached files and reload.
          </div>
          <button id="boot-reload-btn" type="button">Refresh Workspace</button>
        </div>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; text-align: center; font-family: system-ui, sans-serif;">
        Please enable JavaScript to use Pritesh Sir's Maths App!
      </p>
    </noscript>
    <script>
      (function () {
        var cleared = false;
        function clearCachesAndReload(forceReload) {
          var reloadNow = function () {
            if (forceReload) {
              var url = new URL(window.location.href);
              url.searchParams.set('_r', String(Date.now()));
              window.location.replace(url.toString());
            } else {
              window.location.reload();
            }
          };
          var tasks = [];
          try {
            if ('serviceWorker' in navigator) {
              tasks.push(
                navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    return Promise.all(regs.map(function (r) { return r.unregister(); }));
                  })
                  .catch(function () {})
              );
            }
            if ('caches' in window && window.caches && typeof window.caches.keys === 'function') {
              tasks.push(
                window.caches
                  .keys()
                  .then(function (keys) {
                    return Promise.all(keys.map(function (k) { return window.caches.delete(k); }));
                  })
                  .catch(function () {})
              );
            }
          } catch (e) {}
          Promise.race([
            Promise.all(tasks),
            new Promise(function (res) { setTimeout(res, 1200); }),
          ]).finally(reloadNow);
        }

        function showRecovery(reasonText) {
          if (window.__APP_MOUNTED__) return;
          var recovery = document.getElementById('boot-recovery');
          var status = document.getElementById('boot-status');
          if (status) status.textContent = reasonText || 'Cached files are outdated or network is slow.';
          if (recovery) recovery.style.display = 'block';
          var btn = document.getElementById('boot-reload-btn');
          if (btn) {
            btn.onclick = function () {
              clearCachesAndReload(true);
            };
          }
        }

        function tryAutoRecoverOnce(reason) {
          if (window.__APP_MOUNTED__ || cleared) return;
          cleared = true;
          try {
            var key = 'selina_boot_recover_at';
            var last = Number(window.sessionStorage.getItem(key) || '0');
            if (!last || Date.now() - last > 15000) {
              window.sessionStorage.setItem(key, String(Date.now()));
              clearCachesAndReload(true);
              return;
            }
          } catch (e) {}
          showRecovery(reason);
        }

        // Catch stale entry script 404s or mobile syntax/runtime boot failures immediately
        window.addEventListener(
          'error',
          function (evt) {
            if (window.__APP_MOUNTED__) return;
            var target = evt && evt.target;
            if (target && target.tagName === 'SCRIPT') {
              tryAutoRecoverOnce('Updating app scripts from server…');
            } else if (evt && evt.message) {
              showRecovery('Startup error: ' + String(evt.message).slice(0, 120));
            }
          },
          true
        );

        var timer = setTimeout(function () {
          showRecovery('Taking longer than expected on mobile. Tap below to refresh.');
        }, 4500);

        window.__CLEAR_BOOT_TIMER__ = function () {
          window.__APP_MOUNTED__ = true;
          clearTimeout(timer);
          try {
            if (window.location.search.indexOf('_r=') !== -1 && window.history && window.history.replaceState) {
              var cleanUrl = new URL(window.location.href);
              cleanUrl.searchParams.delete('_r');
              window.history.replaceState({}, '', cleanUrl.pathname + cleanUrl.search + cleanUrl.hash);
            }
          } catch (e) {}
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
